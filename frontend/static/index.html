<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280">
  <title>Dawn Age Settlement</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div id="app">
    <main id="game-root" aria-label="Settlement">
      <canvas id="world" width="960" height="540"></canvas>

      <header id="hud">
        <div id="era-banner" class="era-banner"><span class="era-label">Era</span><span id="era-name">Dawn Age</span></div>
        <div class="res-row">
          <div class="res" id="res-food" title="Food"><span class="ico">&#x1F35E;</span><b>0</b></div>
          <div class="res" id="res-wood" title="Wood"><span class="ico">&#x1FAB5;</span><b>0</b></div>
          <div class="res" id="res-stone" title="Stone"><span class="ico">&#x1FAA8;</span><b>0</b></div>
          <div class="res" id="res-rp" title="Research points"><span class="ico">&#x1F4DC;</span><b>0</b></div>
          <div class="res" id="res-workers" title="Free / total workers"><span class="ico">&#x1F465;</span><b>0/0</b></div>
          <div class="res score" id="res-score" title="Settlement score"><span class="ico">&#x2B50;</span><b>0</b></div>
        </div>
        <button id="btn_speed" class="hud-btn" data-target="btn_speed" title="Game speed">1x</button>
        <button id="btn_inspect" class="hud-btn" data-target="btn_inspect" title="Config inspector">i</button>
        <button id="btn_mute" class="hud-btn" data-target="btn_mute" title="Sound on/off">&#x1F507;</button>
      </header>

      <section id="advisor" aria-live="polite">
        <img id="advisor-portrait" class="portrait" src="/static/assets/sprites/advisor_welcome.png" alt="Elder Kaelen">
        <div class="bubble">
          <div class="speaker">Elder Kaelen</div>
          <div id="step-chip" class="step-chip">Step 1/3</div>
          <p id="advisor-text"></p>
        </div>
      </section>

      <section id="quest-card" class="quest-card">
        <div class="q-title" id="quest-title"></div>
        <ul id="quest-objectives" class="q-objectives"></ul>
        <div class="q-bar"><div id="quest-fill" class="q-fill"></div></div>
        <button id="btn_claim_quest" class="gold-btn claim" data-target="btn_claim_quest" title="Claim Reward" hidden>&#x1F381; Claim Reward</button>
      </section>

      <footer id="build-bar">
        <div id="cards" class="cards"></div>
      </footer>
      <button id="btn_research" data-target="btn_research" class="research sal-low" title="Research">
        <span class="r-ico">&#x1F4DC;</span><span class="r-label">Research</span>
      </button>
      <button id="btn_expedition" data-target="btn_expedition" class="expedition" title="Expedition" hidden>
        <span class="r-ico">&#x2694;&#xFE0F;</span><span class="r-label">Expedition</span>
      </button>

      <div id="hint-arrow" class="hint-arrow" hidden></div>
      <div id="inspector" class="inspector" hidden></div>
      <div id="toast" class="toast" hidden></div>
      <div id="stub-banner" class="stub-banner" hidden>STUB / DEV MODE &mdash; NOT LIVE MUSE SPARK</div>

      <div id="welcome-modal" class="modal-backdrop" hidden>
        <div class="modal welcome">
          <img class="portrait big" src="/static/assets/sprites/advisor_welcome.png" alt="Elder Kaelen" width="88" height="88">
          <div>
            <h2>Elder Kaelen <small>&middot; Keeper of Ages</small></h2>
            <p id="welcome-text"></p>
            <button id="btn_advisor_ok" class="gold-btn" data-target="btn_advisor_ok">Let's build!</button>
          </div>
        </div>
      </div>

      <div id="research-modal" class="modal-backdrop" hidden>
        <div class="modal tech-modal">
          <div class="tech-head">
            <h2>Tech Tree</h2>
            <span id="tech-rp" class="tech-rp"></span>
            <button id="btn_close_research" class="close-btn" data-target="btn_close_research" title="Close">&times;</button>
          </div>
          <div id="tech-tree" class="tech-tree"></div>
        </div>
      </div>

      <div id="expedition-modal" class="modal-backdrop" hidden>
        <div class="modal expedition-modal">
          <div class="tech-head">
            <h2>Expedition Map</h2>
            <span id="expedition-cost" class="tech-rp"></span>
            <button id="btn_close_expedition" class="close-btn" data-target="btn_close_expedition" title="Close">&times;</button>
          </div>
          <div id="encounters" class="encounters"></div>
        </div>
      </div>

      <div id="click-layer"></div>
    </main>

    <aside id="right-dock" aria-label="AI Director"></aside>
  </div>

  <div id="replay-root" hidden></div>

  <script type="module" src="/static/main.js"></script>
</body>
</html>
