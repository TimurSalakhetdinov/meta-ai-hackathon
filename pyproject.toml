[project]
name = "meta-game-onboarding-optimizer"
version = "0.1.0"
description = "Closed-loop AI playtesting and onboarding optimization for an original browser city-builder."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "playwright>=1.47",
    "pillow>=10.4",
    "python-dotenv>=1.0",
    "pytest>=8.0",
    "httpx>=0.27",
    "elevenlabs>=1.0",
]

[tool.setuptools]
packages = ["backend", "backend.agents", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
